<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma de Actividades</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold mb-4">Cronograma de Actividades</h2>
        <div class="mb-4">
            <input type="text" id="actividad" placeholder="Nueva actividad" class="border p-2 rounded w-full">
            <input type="date" id="fecha" class="border p-2 rounded w-full mt-2">
            <button onclick="agregarActividad()" class="bg-blue-500 text-white px-4 py-2 rounded mt-2">Agregar</button>
        </div>
    </div>

    <div class="max-w-4xl mx-auto bg-white p-6 mt-6 rounded-lg shadow-lg">
        <table class="w-full bg-white shadow-lg rounded-lg">
            <thead>
                <tr class="bg-gray-300">
                    <th class="p-2">Actividad</th>
                    <th class="p-2">Fecha</th>
                    <th class="p-2">Acciones</th>
                </tr>
            </thead>
            <tbody id="listaActividades"></tbody>
        </table>
    </div>

    <!-- Modal de edición -->
    <div id="modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex justify-center items-center">
        <div class="bg-white p-10 rounded-lg shadow-lg w-[600px]">
            <h3 class="text-xl font-bold mb-4">Editar Actividad</h3>
            <input type="text" id="editActividad" class="border p-2 rounded w-full" placeholder="Actividad">
            <input type="date" id="editFecha" class="border p-2 rounded w-full mt-2">
            <div class="flex justify-end mt-4 space-x-3">
                <button onclick="guardarEdicion()" class="bg-green-500 text-white px-4 py-2 rounded">Guardar</button>
                <button onclick="cerrarModal()" class="bg-gray-500 text-white px-4 py-2 rounded">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let editIndex = null;

        document.addEventListener("DOMContentLoaded", cargarActividades);

        function agregarActividad() {
            const actividad = document.getElementById("actividad").value;
            const fecha = document.getElementById("fecha").value;
            if (actividad && fecha) {
                const actividades = JSON.parse(localStorage.getItem("actividades")) || [];
                actividades.push({ actividad, fecha });
                localStorage.setItem("actividades", JSON.stringify(actividades));
                cargarActividades();
                document.getElementById("actividad").value = "";
                document.getElementById("fecha").value = "";
            }
        }

        function cargarActividades() {
            const lista = document.getElementById("listaActividades");
            lista.innerHTML = "";
            const actividades = JSON.parse(localStorage.getItem("actividades")) || [];
            actividades.forEach((item, index) => {
                const row = document.createElement("tr");
                row.className = "border-b";
                row.innerHTML = `
                    <td class="p-2">${item.actividad}</td>
                    <td class="p-2">${item.fecha}</td>
                    <td class="p-2 flex space-x-4">
                        <button onclick="editarActividad(${index})" class="bg-yellow-500 text-white px-3 py-1 rounded">Editar</button>
                        <button onclick="eliminarActividad(${index})" class="bg-red-500 text-white px-3 py-1 rounded">Eliminar</button>
                    </td>
                `;
                lista.appendChild(row);
            });
        }

        function eliminarActividad(index) {
            const actividades = JSON.parse(localStorage.getItem("actividades")) || [];
            actividades.splice(index, 1);
            localStorage.setItem("actividades", JSON.stringify(actividades));
            cargarActividades();
        }

        function editarActividad(index) {
            const actividades = JSON.parse(localStorage.getItem("actividades")) || [];
            editIndex = index;
            document.getElementById("editActividad").value = actividades[index].actividad;
            document.getElementById("editFecha").value = actividades[index].fecha;
            document.getElementById("modal").classList.remove("hidden");
        }

        function guardarEdicion() {
            const actividades = JSON.parse(localStorage.getItem("actividades")) || [];
            actividades[editIndex].actividad = document.getElementById("editActividad").value;
            actividades[editIndex].fecha = document.getElementById("editFecha").value;
            localStorage.setItem("actividades", JSON.stringify(actividades));
            cerrarModal();
            cargarActividades();
        }

        function cerrarModal() {
            document.getElementById("modal").classList.add("hidden");
        }
    </script>
</body>
</html>
